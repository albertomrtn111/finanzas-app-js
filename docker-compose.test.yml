# Postgres de usar y tirar para las pruebas de extremo a extremo (npm run test:integration).
# Los datos viven en memoria y desaparecen al pararlo:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=postgresql://postgres:postgres@localhost:54329/nextfinance_test npm run test:integration
#   docker compose -f docker-compose.test.yml down
services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextfinance_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
